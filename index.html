<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mi Rutina · Sary</title>
<!-- PWA -->
<meta name="theme-color" content="#7C3AED">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Semana">
<meta name="application-name" content="Mi Semana">
<meta name="description" content="Hábitos semanales por categoría · Personal, Casa y Nutrición">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --personal: #7C3AED;
  --personal-l: #EDE9FE;
  --personal-m: #C4B5FD;
  --casa:     #059669;
  --casa-l:   #D1FAE5;
  --casa-m:   #6EE7B7;
  --alim:     #D97706;
  --alim-l:   #FEF3C7;
  --alim-m:   #FCD34D;
  --green:    #22C55E;
  --green-l:  #DCFCE7;
  --bg:       #F0F2F7;
  --card:     #FFFFFF;
  --text:     #1E1B4B;
  --muted:    #6B7280;
  --border:   #E5E7EB;
  --r:        16px;
  --cur:      var(--personal);
  --cur-l:    var(--personal-l);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; min-height: 100vh; overflow-x: hidden; }

/* ── HEADER ── */
.app-header {
  position: sticky; top: 0; z-index: 60;
  background: white; border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 12px rgba(0,0,0,.07);
  padding: 14px 16px 10px;
}
.hdr-row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.app-title { font-size: 19px; font-weight: 900; }
.app-title span { color: var(--cur); transition: color .2s; }
.week-pill {
  font-size: 11px; font-weight: 800; padding: 4px 10px;
  background: var(--bg); border-radius: 20px; color: var(--muted);
  white-space: nowrap;
}
.hdr-row2 { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.nav-btn {
  flex-shrink: 0; padding: 6px 10px; background: var(--bg); border: none;
  border-radius: 8px; font-family: 'Nunito', sans-serif; font-size: 12px;
  font-weight: 800; color: var(--muted); cursor: pointer;
}
.nav-btn:hover { background: var(--border); }
.week-label { flex: 1; text-align: center; font-size: 12px; font-weight: 700; color: var(--text); }
.today-btn { padding: 5px 10px; background: var(--green-l); color: var(--green); border: none; border-radius: 8px; font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 800; cursor: pointer; flex-shrink: 0; }

/* ── CATEGORY TABS ── */
.cat-tabs { display: flex; gap: 8px; padding: 0 16px 10px; }
.cat-btn {
  flex: 1; padding: 8px 4px; border: 2px solid var(--border); border-radius: 12px;
  background: var(--bg); font-family: 'Nunito', sans-serif; font-size: 11.5px; font-weight: 800;
  color: var(--muted); cursor: pointer; transition: all .18s; display: flex;
  align-items: center; justify-content: center; gap: 4px;
}
.cat-btn[data-cat="personal"].active  { border-color: var(--personal); background: var(--personal-l); color: var(--personal); }
.cat-btn[data-cat="casa"].active      { border-color: var(--casa);     background: var(--casa-l);     color: var(--casa); }
.cat-btn[data-cat="alimentacion"].active { border-color: var(--alim); background: var(--alim-l); color: var(--alim); }

/* ── WEEK PROGRESS ── */
.week-prog {
  padding: 8px 16px 12px; background: white;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.wp-text { font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.wp-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.wp-fill  { height: 100%; border-radius: 3px; transition: width .4s ease; background: var(--cur); }
.wp-pct   { font-size: 12px; font-weight: 900; color: var(--cur); white-space: nowrap; transition: color .2s; }

/* ── CARDS SCROLL ── */
.cards-scroll {
  display: flex; gap: 10px; padding: 14px 14px 32px;
  overflow-x: auto; overflow-y: visible;
  scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.cards-scroll::-webkit-scrollbar { display: none; }

/* ── DAY CARD ── */
.day-card {
  flex-shrink: 0; width: min(75vw, 255px);
  background: var(--card); border-radius: var(--r);
  box-shadow: 0 2px 10px rgba(0,0,0,.07);
  scroll-snap-align: start; display: flex; flex-direction: column;
  border: 2px solid transparent; transition: border-color .2s;
  overflow: hidden;
}
.day-card.today-card { border-color: var(--green); box-shadow: 0 4px 20px rgba(34,197,94,.18); }

.card-head {
  padding: 12px 13px 8px; border-bottom: 1px solid var(--border);
  background: white;
}
.card-head.today-head { background: var(--green-l); }
.card-head-top { display: flex; justify-content: space-between; align-items: flex-start; }
.card-weekday { font-size: 13px; font-weight: 900; }
.card-date    { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.card-today-tag { font-size: 9px; font-weight: 800; color: var(--green); letter-spacing: .5px; }
.prog-pill {
  font-size: 10.5px; font-weight: 900; padding: 3px 9px; border-radius: 20px;
  background: var(--cur-l); color: var(--cur); white-space: nowrap; transition: background .2s, color .2s;
}
.card-prog-bar { height: 4px; background: #F3F4F6; margin: 8px 0 0; border-radius: 2px; overflow: hidden; }
.card-prog-fill { height: 100%; border-radius: 2px; background: var(--cur); transition: width .35s ease; }

/* ── HABITS ── */
.habits-list { flex: 1; }

.habit-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 13px; border-bottom: 1px solid #F9FAFB;
  cursor: pointer; transition: background .1s;
}
.habit-item:hover { background: #FAFAFA; }
.habit-item.done .habit-name { color: #9CA3AF; text-decoration: line-through; }

.hcheck {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid #D1D5DB; background: white; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: all .15s; margin-top: 1px;
  cursor: pointer;
}
.hcheck.checked { background: var(--green); border-color: var(--green); color: white; }

.habit-content { flex: 1; min-width: 0; }
.habit-name { font-size: 12.5px; font-weight: 700; line-height: 1.3; }

/* Subtask badge */
.st-badge {
  display: inline-flex; align-items: center; gap: 3px;
  margin-top: 4px; padding: 2px 7px; border-radius: 6px;
  font-size: 10px; font-weight: 800; cursor: pointer; transition: .15s;
  user-select: none;
}
.st-badge.empty    { background: #F3F4F6; color: #9CA3AF; }
.st-badge.partial  { background: #FEF9C3; color: #B45309; }
.st-badge.complete { background: var(--green-l); color: #16A34A; }

/* Subtask panel */
.st-panel { display: none; padding: 4px 13px 8px 45px; background: #FAFAFA; }
.st-panel.open { display: block; animation: slideDown .15s ease; }
@keyframes slideDown { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }

.st-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; border-bottom: 1px solid #F3F4F6; cursor: pointer;
}
.st-row:last-child { border-bottom: none; }
.stcheck {
  width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid #D1D5DB; background: white; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 9px;
  transition: all .12s;
}
.stcheck.checked { background: var(--green); border-color: var(--green); color: white; }
.st-name { font-size: 11px; font-weight: 600; color: var(--muted); }
.st-name.done { text-decoration: line-through; color: #D1D5DB; }

/* Water counter */
.water-row { display: flex; align-items: center; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.wdot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 1.5px solid #BFDBFE; background: #DBEAFE;
  cursor: pointer; transition: all .1s;
}
.wdot.on { background: #3B82F6; border-color: #3B82F6; }
.wdot:hover { transform: scale(1.2); }
.wlabel { font-size: 10px; font-weight: 800; color: #3B82F6; }

/* Delete btn (custom) */
.del-btn {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
  background: none; border: none; color: #E5E7EB; font-size: 15px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  line-height: 1; transition: all .15s; margin-top: 1px; padding: 0;
}
.del-btn:hover { color: #EF4444; background: #FEE2E2; }

/* Add btn */
.add-row { padding: 10px 13px 12px; }
.add-habit-btn {
  display: flex; align-items: center; gap: 5px;
  background: none; border: none; padding: 0;
  font-family: 'Nunito', sans-serif; font-size: 12.5px; font-weight: 800;
  color: #9CA3AF; cursor: pointer; transition: color .15s;
}
.add-habit-btn:hover { color: var(--cur); }
.add-plus { font-size: 18px; font-weight: 900; line-height: 1; }

/* Empty */
.empty-cat { padding: 20px 13px; text-align: center; font-size: 12px; color: #D1D5DB; }

/* ── MODAL ── */
.modal-ov {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200;
  display: none; align-items: flex-end; justify-content: center;
  animation: fadein .2s ease;
}
.modal-ov.open { display: flex; }
@keyframes fadein { from{opacity:0} to{opacity:1} }
.modal-sheet {
  background: white; border-radius: 24px 24px 0 0;
  padding: 20px 20px 44px; width: 100%; max-width: 480px;
  animation: slideup .28s cubic-bezier(.2,.9,.4,1);
}
@keyframes slideup { from{transform:translateY(100%)} to{transform:translateY(0)} }
.mhandle { width: 36px; height: 4px; background: #E5E7EB; border-radius: 2px; margin: 0 auto 18px; }
.mtitle  { font-size: 17px; font-weight: 900; margin-bottom: 16px; }
.mlabel  { font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; display: block; }
.minput  {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 11px;
  font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; outline: none; margin-bottom: 14px;
}
.minput:focus { border-color: var(--cur); }
.mcats { display: flex; gap: 8px; margin-bottom: 14px; }
.mcat {
  flex: 1; padding: 8px 4px; border: 2px solid var(--border); border-radius: 10px;
  background: none; font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 800;
  color: var(--muted); cursor: pointer; transition: all .15s;
}
.mcat.sel-personal    { border-color: var(--personal); background: var(--personal-l); color: var(--personal); }
.mcat.sel-casa        { border-color: var(--casa);     background: var(--casa-l);     color: var(--casa); }
.mcat.sel-alimentacion{ border-color: var(--alim);     background: var(--alim-l);     color: var(--alim); }
.mdays-all {
  display: inline-block; padding: 7px 14px; border: 1.5px solid var(--border);
  border-radius: 8px; font-family: 'Nunito', sans-serif; font-size: 11.5px; font-weight: 800;
  color: var(--muted); cursor: pointer; margin-bottom: 10px;
}
.mdays-all.sel { border-color: var(--cur); background: var(--cur-l); color: var(--cur); }
.mdays-grid { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.mdaychip {
  padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 8px;
  font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 800;
  color: var(--muted); cursor: pointer;
}
.mdaychip.sel { border-color: var(--cur); background: var(--cur-l); color: var(--cur); }
.mfoot { display: flex; gap: 10px; margin-top: 4px; }
.mbtn {
  flex: 1; padding: 13px; border: none; border-radius: 12px;
  font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 900; cursor: pointer;
}
.mbtn.cancel  { background: #F3F4F6; color: var(--muted); }
.mbtn.confirm { background: var(--cur); color: white; transition: background .2s; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1F2937; color: white; padding: 10px 22px; border-radius: 20px;
  font-size: 13px; font-weight: 700; opacity: 0; transition: all .3s;
  z-index: 300; white-space: nowrap; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <div class="hdr-row1">
    <div class="app-title">Mi Rutina <span id="hdr-cat-name">· Personal</span></div>
    <div class="week-pill" id="week-pill">sem 0</div>
  </div>
  <div class="hdr-row2">
    <button class="nav-btn" id="prev-week">← Ant.</button>
    <div class="week-label" id="week-label">cargando...</div>
    <button class="nav-btn" id="next-week">Sig. →</button>
    <button class="today-btn" id="today-btn">Hoy</button>
  </div>
  <div class="cat-tabs">
    <button class="cat-btn active" data-cat="personal">👤 Personal</button>
    <button class="cat-btn" data-cat="casa">🏠 Casa</button>
    <button class="cat-btn" data-cat="alimentacion">🥗 Nutrición</button>
  </div>
</header>

<!-- WEEK PROGRESS -->
<div class="week-prog">
  <div class="wp-text" id="wp-text">0 / 0 esta semana</div>
  <div class="wp-track"><div class="wp-fill" id="wp-fill" style="width:0%"></div></div>
  <div class="wp-pct" id="wp-pct">0%</div>
</div>

<!-- DAY CARDS -->
<div class="cards-scroll" id="cards-scroll"></div>

<!-- MODAL -->
<div class="modal-ov" id="modal">
  <div class="modal-sheet">
    <div class="mhandle"></div>
    <div class="mtitle">+ Nuevo hábito</div>

    <label class="mlabel">Nombre del hábito</label>
    <input class="minput" id="m-name" type="text" placeholder="Ej: Leer 10 páginas..." maxlength="50">

    <label class="mlabel">Emoji (opcional)</label>
    <input class="minput" id="m-icon" type="text" placeholder="⭐" maxlength="3" style="width:80px;margin-bottom:14px">

    <label class="mlabel">Categoría</label>
    <div class="mcats" id="m-cats">
      <button class="mcat" data-cat="personal">👤 Personal</button>
      <button class="mcat" data-cat="casa">🏠 Casa</button>
      <button class="mcat" data-cat="alimentacion">🥗 Nutrición</button>
    </div>

    <label class="mlabel">¿Qué días?</label>
    <button class="mdays-all sel" id="m-all">Todos los días</button>
    <div class="mdays-grid" id="m-days">
      <button class="mdaychip" data-d="1">Lun</button>
      <button class="mdaychip" data-d="2">Mar</button>
      <button class="mdaychip" data-d="3">Mié</button>
      <button class="mdaychip" data-d="4">Jue</button>
      <button class="mdaychip" data-d="5">Vie</button>
      <button class="mdaychip" data-d="6">Sáb</button>
      <button class="mdaychip" data-d="0">Dom</button>
    </div>

    <div class="mfoot">
      <button class="mbtn cancel" id="m-cancel">Cancelar</button>
      <button class="mbtn confirm" id="m-ok">Añadir hábito ✓</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════
const KEY = 'sary-rutina-v2';
const DAYS_ES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MONTHS_ES = ['enero','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const CAT_COLORS = { personal:'#7C3AED', casa:'#059669', alimentacion:'#D97706' };
const CAT_LIGHT  = { personal:'#EDE9FE', casa:'#D1FAE5', alimentacion:'#FEF3C7' };
const CAT_NAMES  = { personal:'· Personal', casa:'· Casa', alimentacion:'· Nutrición' };

const HABITS = {
  personal: [
    { id:'p1',  name:'Despertarse temprano',      icon:'⏰', days:'all' },
    { id:'p2',  name:'Vestirse / Abrigarse bien', icon:'🧥', days:'all' },
    { id:'p3',  name:'Higiene matutina',           icon:'🌅', days:'all',
      subtasks:['Lavarse la cara','Desodorante','Skincare mañana','Peinarse'] },
    { id:'p4',  name:'Baño / Ducha',              icon:'🚿', days:'all' },
    { id:'p5',  name:'Limpiar orejas',            icon:'👂', days:'all' },
    { id:'p6',  name:'Higiene nocturna',          icon:'🌙', days:'all',
      subtasks:['Lavarse la cara','Cepillarse dientes','Skincare noche','Preparar mañana'] },
    { id:'p7',  name:'Cepillarse los dientes',    icon:'🦷', days:'all' },
    { id:'p8',  name:'Escribir en diario',         icon:'📓', days:'all' },
    { id:'p9',  name:'Meditar 5–15 minutos',       icon:'🧘', days:'all' },
    { id:'p10', name:'Dormir temprano',            icon:'😴', days:'all' },
    // Exercise rotation
    { id:'pex1', name:'Glúteos y piernas',         icon:'🍑', days:[1] },
    { id:'pex2', name:'Cardio + resistencia',       icon:'🏃', days:[2] },
    { id:'pex3', name:'Descanso activo',            icon:'🚶', days:[3] },
    { id:'pex4', name:'Espalda y brazos',           icon:'💪', days:[4] },
    { id:'pex5', name:'Piernas + glúteos + core',   icon:'🦵', days:[5] },
    { id:'pex6', name:'Cardio ligero',              icon:'🚴', days:[6] },
    { id:'pex7', name:'Descanso completo',          icon:'😌', days:[0] },
  ],
  casa: [
    { id:'c1', name:'Tender la cama',          icon:'🛏️', days:'all' },
    { id:'c2', name:'Ordenar escritorio',       icon:'🖥️', days:'all' },
    { id:'c3', name:'Limpiar cuarto (5 min)',   icon:'🧹', days:'all' },
    { id:'c4', name:'Lavar platos',            icon:'🍽️', days:'all' },
    { id:'c5', name:'Sacar la basura',         icon:'🗑️', days:[1,3,5] },
    { id:'c6', name:'Barrer',                  icon:'🧺', days:[1,4] },
    { id:'c7', name:'Organizar ropa',          icon:'👚', days:[0,3,6] },
    { id:'c8', name:'Limpieza profunda',       icon:'✨', days:[6] },
  ],
  alimentacion: [
    { id:'a1', name:'Desayunar bien',           icon:'🥣', days:'all' },
    { id:'a2', name:'Agua – 8 vasos',          icon:'💧', days:'all', water:8 },
    { id:'a3', name:'Almuerzo saludable',        icon:'🥗', days:'all' },
    { id:'a4', name:'Cena ligera',              icon:'🍲', days:'all' },
    { id:'a5', name:'Evitar azúcar procesada',  icon:'🚫', days:'all' },
    { id:'a6', name:'Vitaminas / suplementos',  icon:'💊', days:'all' },
    { id:'a7', name:'No saltarse comidas',      icon:'✅', days:'all' },
  ]
};

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let S = {
  checks:   {},   // { dateKey: { hid: true } }
  subtasks: {},   // { 'dateKey_hid': [bool,...] }
  water:    {},   // { 'dateKey_hid': N }
  custom:   { personal:[], casa:[], alimentacion:[] },
  offset:   0,    // week offset (0 = this week)
  cat:      'personal'
};

function loadS() { try { const d=JSON.parse(localStorage.getItem(KEY)); if(d) S={...S,...d}; }catch{} }
function saveS() { localStorage.setItem(KEY,JSON.stringify(S)); }

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function monday(date=new Date()) {
  const d=new Date(date); const day=d.getDay();
  d.setDate(d.getDate()-(day===0?6:day-1)); d.setHours(0,0,0,0); return d;
}
function weekDays() {
  const m=monday(); m.setDate(m.getDate()+S.offset*7);
  return Array.from({length:7},(_,i)=>{ const d=new Date(m); d.setDate(m.getDate()+i); return d; });
}
function dk(date) { return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}`; }
function p(n) { return String(n).padStart(2,'0'); }
function isToday(date) { const t=new Date(); return date.toDateString()===t.toDateString(); }

function habitsForDay(cat, dow) {
  return [...(HABITS[cat]||[]), ...(S.custom[cat]||[])].filter(h =>
    h.days==='all' || (Array.isArray(h.days) && h.days.includes(dow))
  );
}
function isBuiltin(cat, hid) { return !!(HABITS[cat]||[]).find(h=>h.id===hid); }

function checked(dateK, hid) { return !!(S.checks[dateK]?.[hid]); }
function toggle(dateK, hid) {
  if(!S.checks[dateK]) S.checks[dateK]={};
  S.checks[dateK][hid]=!S.checks[dateK][hid];
  if(!S.checks[dateK][hid]) delete S.checks[dateK][hid];
  saveS();
}
function getSubtasks(dateK, hid, len) {
  const k=`${dateK}_${hid}`;
  if(!S.subtasks[k]) S.subtasks[k]=Array(len).fill(false);
  return S.subtasks[k];
}
function toggleSubtask(dateK, hid, idx, len) {
  const k=`${dateK}_${hid}`;
  if(!S.subtasks[k]) S.subtasks[k]=Array(len).fill(false);
  S.subtasks[k][idx]=!S.subtasks[k][idx];
  if(!S.checks[dateK]) S.checks[dateK]={};
  if(S.subtasks[k].every(Boolean)) S.checks[dateK][hid]=true;
  else delete S.checks[dateK][hid];
  saveS();
}
function getWater(dateK, hid) { return S.water[`${dateK}_${hid}`]||0; }
function setWater(dateK, hid, val, goal) {
  S.water[`${dateK}_${hid}`]=val;
  if(!S.checks[dateK]) S.checks[dateK]={};
  if(val>=goal) S.checks[dateK][hid]=true; else delete S.checks[dateK][hid];
  saveS();
}
function weekProgress(cat) {
  const days=weekDays(); let done=0,total=0;
  days.forEach(d=>{ const dateK=dk(d); habitsForDay(cat,d.getDay()).forEach(h=>{ total++; if(checked(dateK,h.id))done++; }); });
  return {done,total,pct:total?Math.round((done/total)*100):0};
}

// ═══════════════════════════════════════════════
//  CSS VAR HELPERS
// ═══════════════════════════════════════════════
function setCatVars(cat) {
  document.documentElement.style.setProperty('--cur',   CAT_COLORS[cat]);
  document.documentElement.style.setProperty('--cur-l', CAT_LIGHT[cat]);
}

// ═══════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════
function render() {
  setCatVars(S.cat);
  renderHeader();
  renderProgress();
  renderCards();
}

function renderHeader() {
  const days=weekDays();
  const first=days[0], last=days[6];
  const sameMonth=first.getMonth()===last.getMonth();
  const label=sameMonth
    ? `${DAYS_ES[first.getDay()].slice(0,3)} ${first.getDate()} – ${DAYS_ES[last.getDay()].slice(0,3)} ${last.getDate()} de ${MONTHS_ES[first.getMonth()]} ${first.getFullYear()}`
    : `${first.getDate()} ${MONTHS_ES[first.getMonth()]} – ${last.getDate()} ${MONTHS_ES[last.getMonth()]}`;
  document.getElementById('week-label').textContent = S.offset===0 ? label : S.offset<0 ? `Semana pasada · ${label}` : `Próxima semana · ${label}`;
  document.getElementById('week-pill').textContent = `Sem. ${weekNumber(days[0])}`;
  document.getElementById('hdr-cat-name').textContent = CAT_NAMES[S.cat];
  document.querySelectorAll('.cat-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.cat===S.cat);
  });
}

function weekNumber(d) {
  const d2=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  d2.setUTCDate(d2.getUTCDate()+4-(d2.getUTCDay()||7));
  const yr=new Date(Date.UTC(d2.getUTCFullYear(),0,1));
  return Math.ceil((((d2-yr)/86400000)+1)/7);
}

function renderProgress() {
  const {done,total,pct}=weekProgress(S.cat);
  document.getElementById('wp-text').textContent=`${done} / ${total} esta semana`;
  document.getElementById('wp-fill').style.width=pct+'%';
  document.getElementById('wp-pct').textContent=pct+'%';
}

function renderCards() {
  const container=document.getElementById('cards-scroll');
  container.innerHTML='';
  const days=weekDays();
  const color=CAT_COLORS[S.cat];
  const light=CAT_LIGHT[S.cat];

  days.forEach(day=>{
    const dateK=dk(day);
    const dow=day.getDay();
    const habits=habitsForDay(S.cat,dow);
    const doneN=habits.filter(h=>checked(dateK,h.id)).length;
    const pct=habits.length?Math.round((doneN/habits.length)*100):0;
    const today=isToday(day);

    // CARD
    const card=document.createElement('div');
    card.className='day-card'+(today?' today-card':'');

    // HEAD
    const head=document.createElement('div');
    head.className='card-head'+(today?' today-head':'');
    const headTop=document.createElement('div'); headTop.className='card-head-top';
    const headLeft=document.createElement('div');
    headLeft.innerHTML=`<div class="card-weekday" style="color:${today?'var(--green)':'var(--text)'}">${DAYS_ES[dow]}</div>
      <div class="card-date">${day.getDate()} de ${MONTHS_ES[day.getMonth()]}${today?' <span class="card-today-tag">· HOY</span>':''}</div>`;
    const pill=document.createElement('div'); pill.className='prog-pill';
    pill.style.background=today?'rgba(34,197,94,.15)':light;
    pill.style.color=today?'#16A34A':color;
    pill.textContent=`${doneN}/${habits.length}`;
    headTop.appendChild(headLeft); headTop.appendChild(pill);
    const progBar=document.createElement('div'); progBar.className='card-prog-bar';
    const progFill=document.createElement('div'); progFill.className='card-prog-fill';
    progFill.style.width=pct+'%';
    progFill.style.background=today?'var(--green)':color;
    progBar.appendChild(progFill);
    head.appendChild(headTop); head.appendChild(progBar);

    // LIST
    const list=document.createElement('div'); list.className='habits-list';

    if(!habits.length) {
      const empty=document.createElement('div'); empty.className='empty-cat';
      empty.textContent='Sin hábitos este día';
      list.appendChild(empty);
    } else {
      habits.forEach(h=>{
        const isChk=checked(dateK,h.id);
        const isCustm=!isBuiltin(S.cat,h.id);

        // ROW
        const row=document.createElement('div');
        row.className='habit-item'+(isChk?' done':'');

        const chk=document.createElement('div');
        chk.className='hcheck'+(isChk?' checked':'');
        chk.innerHTML=isChk?'✓':'';
        chk.onclick=(e)=>{ e.stopPropagation(); toggle(dateK,h.id); render(); };

        const content=document.createElement('div'); content.className='habit-content';
        const nameEl=document.createElement('div'); nameEl.className='habit-name';
        nameEl.textContent=(h.icon?h.icon+' ':'')+h.name;
        content.appendChild(nameEl);

        // --- SUBTASKS ---
        if(h.subtasks?.length) {
          const stArr=getSubtasks(dateK,h.id,h.subtasks.length);
          const stDone=stArr.filter(Boolean).length;
          const badge=document.createElement('div');
          const cls=stDone===h.subtasks.length?'complete':stDone>0?'partial':'empty';
          badge.className=`st-badge ${cls}`;
          badge.textContent=`☑ ${stDone}/${h.subtasks.length}`;
          const panelId=`stp-${dateK}-${h.id}`;
          badge.onclick=(e)=>{ e.stopPropagation(); const p=document.getElementById(panelId); if(p) p.classList.toggle('open'); };
          content.appendChild(badge);
          row.appendChild(chk); row.appendChild(content);
          if(isCustm) addDel(row,h);
          list.appendChild(row);

          // panel
          const panel=document.createElement('div'); panel.className='st-panel'; panel.id=panelId;
          h.subtasks.forEach((st,i)=>{
            const sr=document.createElement('div'); sr.className='st-row';
            const sc=document.createElement('div'); sc.className='stcheck'+(stArr[i]?' checked':'');
            sc.innerHTML=stArr[i]?'✓':'';
            const sn=document.createElement('div'); sn.className='st-name'+(stArr[i]?' done':'');
            sn.textContent=st;
            sr.onclick=(e)=>{ e.stopPropagation(); toggleSubtask(dateK,h.id,i,h.subtasks.length); render(); };
            sr.appendChild(sc); sr.appendChild(sn); panel.appendChild(sr);
          });
          list.appendChild(panel);
          return;
        }

        // --- WATER ---
        if(h.water) {
          const cnt=getWater(dateK,h.id);
          const wr=document.createElement('div'); wr.className='water-row';
          for(let i=0;i<h.water;i++){
            const dot=document.createElement('div'); dot.className='wdot'+(i<cnt?' on':'');
            dot.onclick=(e)=>{ e.stopPropagation(); setWater(dateK,h.id,i<cnt?i:i+1,h.water); render(); };
            wr.appendChild(dot);
          }
          const wl=document.createElement('div'); wl.className='wlabel'; wl.textContent=`${cnt}/${h.water}`;
          wr.appendChild(wl); content.appendChild(wr);
        }

        row.appendChild(chk); row.appendChild(content);
        if(isCustm) addDel(row,h);
        list.appendChild(row);
      });
    }

    // ADD BTN
    const addRow=document.createElement('div'); addRow.className='add-row';
    const addBtn=document.createElement('button'); addBtn.className='add-habit-btn';
    addBtn.style.color=color;
    addBtn.innerHTML=`<span class="add-plus">+</span> Añadir`;
    addBtn.onclick=()=>openModal();
    addRow.appendChild(addBtn);

    card.appendChild(head); card.appendChild(list); card.appendChild(addRow);
    container.appendChild(card);
  });

  // scroll to today
  if(S.offset===0) {
    const todayIdx=days.findIndex(isToday);
    if(todayIdx>0) {
      requestAnimationFrame(()=>{
        const c=container.children[todayIdx];
        if(c) container.scrollLeft=c.offsetLeft-14;
      });
    }
  }
}

function addDel(row, h) {
  const btn=document.createElement('button'); btn.className='del-btn'; btn.textContent='×'; btn.title='Eliminar';
  btn.onclick=(e)=>{ e.stopPropagation();
    if(!confirm(`¿Eliminar "${h.name}"?`)) return;
    for(const c of Object.keys(S.custom)) S.custom[c]=S.custom[c].filter(x=>x.id!==h.id);
    saveS(); render(); toast('Hábito eliminado');
  };
  row.appendChild(btn);
}

// ═══════════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════════
let mCat='personal', mDays='all';

function openModal() {
  mCat=S.cat; mDays='all';
  document.getElementById('m-name').value='';
  document.getElementById('m-icon').value='';
  refreshModal();
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('m-name').focus(),300);
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function refreshModal() {
  document.querySelectorAll('.mcat').forEach(b=>{
    b.className='mcat';
    if(b.dataset.cat===mCat) b.classList.add(`sel-${mCat}`);
  });
  document.getElementById('m-ok').style.background=CAT_COLORS[mCat];
  document.getElementById('m-all').classList.toggle('sel',mDays==='all');
  document.getElementById('m-all').style.borderColor=mDays==='all'?CAT_COLORS[mCat]:'';
  document.getElementById('m-all').style.background=mDays==='all'?CAT_LIGHT[mCat]:'';
  document.getElementById('m-all').style.color=mDays==='all'?CAT_COLORS[mCat]:'';
  document.querySelectorAll('.mdaychip').forEach(c=>{
    const sel=Array.isArray(mDays)&&mDays.includes(parseInt(c.dataset.d));
    c.classList.toggle('sel',sel);
    c.style.borderColor=sel?CAT_COLORS[mCat]:'';
    c.style.background=sel?CAT_LIGHT[mCat]:'';
    c.style.color=sel?CAT_COLORS[mCat]:'';
  });
}

document.getElementById('modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };
document.getElementById('m-cancel').onclick=closeModal;
document.querySelectorAll('.mcat').forEach(b=>{ b.onclick=()=>{ mCat=b.dataset.cat; refreshModal(); }; });
document.getElementById('m-all').onclick=()=>{ mDays='all'; refreshModal(); };
document.querySelectorAll('.mdaychip').forEach(c=>{
  c.onclick=()=>{
    const d=parseInt(c.dataset.d);
    if(mDays==='all') mDays=[];
    const i=mDays.indexOf(d);
    if(i>=0) mDays.splice(i,1); else mDays.push(d);
    if(!mDays.length) mDays='all';
    refreshModal();
  };
});
document.getElementById('m-name').onkeydown=e=>{ if(e.key==='Enter') document.getElementById('m-ok').click(); };
document.getElementById('m-ok').onclick=()=>{
  const name=document.getElementById('m-name').value.trim(); if(!name) return;
  const icon=document.getElementById('m-icon').value.trim()||'⭐';
  S.custom[mCat].push({ id:'cx'+Date.now(), name, icon, days:mDays==='all'?'all':[...mDays] });
  saveS(); closeModal(); render();
  const catNames={personal:'Personal',casa:'Casa',alimentacion:'Nutrición'};
  toast(`✓ Añadido a ${catNames[mCat]}`);
};

// ═══════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════
document.getElementById('prev-week').onclick=()=>{ S.offset--; render(); };
document.getElementById('next-week').onclick=()=>{ S.offset++; render(); };
document.getElementById('today-btn').onclick=()=>{ S.offset=0; render(); };
document.querySelectorAll('.cat-btn').forEach(b=>{
  b.onclick=()=>{ S.cat=b.dataset.cat; render(); };
});

// ═══════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════
function toast(msg,dur=2200) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),dur);
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
loadS();
render();
</script>

      .then(function (r) { console.log('[PWA] SW:', r.scope); })
      .catch(function (e) { console.info('[PWA] Requiere HTTPS:', e.message); });
  });
}
</script>
